<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="/ServieeLogo.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="#0f172a" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Serviee" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
		<noscript>
			<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
		</noscript>
		<script>
			try {
				const theme = localStorage.getItem('theme');
				if (theme === 'light') {
					document.documentElement.classList.add('light');
					document.documentElement.classList.remove('dark');
					document.documentElement.setAttribute('data-theme', 'light');
				} else {
					document.documentElement.classList.add('dark');
					document.documentElement.classList.remove('light');
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			} catch (e) {}

			window.addEventListener('beforeinstallprompt', (e) => {
				e.preventDefault();
				window.deferredPwaPrompt = e;
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
